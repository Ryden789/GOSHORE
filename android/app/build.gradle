plugins {
    id 'com.android.application' version '8.5.2'
    id 'com.chaquo.python' version '16.1.0'
}

android {
    namespace 'com.goshor.app'
    compileSdk 34

    // 公开示例版可用 -PGOSHORE_ASSETS=.../mobile_assets_sample 切换资产；
    // 不传时仍指向本地完整题库产物，保持开发机行为不变。
    def goshoreAssets = project.findProperty("GOSHORE_ASSETS")
            ?: "d:/GOSHORE/.tools/mobile_prep/mobile_assets"

    defaultConfig {
        applicationId "com.goshor.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"

        // 公开版只发 arm64；Chaquopy 要求 ndk.abiFilters，且必须与 splits 一致。
        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.13"
            buildPython "C:/Users/29364/AppData/Local/Programs/Python/Python313/python.exe"
            pip {
                install "httpx"
                options "--no-index", "--find-links", "D:/GOSHORE/.trae/wheels"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 大体量资产：images.zip 已是 STORED，禁止 aapt 再压缩；db 保留压缩
    androidResources {
        noCompress "zip"
    }

    sourceSets {
        main {
            // goshor_server 自身 + 通过 junction 提供的桌面端 app 包（import app.db）
            python.srcDirs += ["src/main/python", "d:/GOSHORE/.tools/mobile_py"]
            assets.srcDirs += [goshoreAssets]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // 公开版只发 arm64：用 ndk.abiFilters 限定单一 ABI 即可；
    // AGP 不允许它与 splits.abi 同时存在，因此不再启用 splits。

    dependencies {
        implementation 'androidx.core:core:1.13.1'
    }
}
