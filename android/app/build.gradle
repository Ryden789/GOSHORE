plugins {
    id 'com.android.application' version '8.5.2'
    id 'com.chaquo.python' version '16.1.0'
}

android {
    namespace 'com.goshor.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.goshor.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            version "3.13"
            buildPython "C:/Users/29364/AppData/Local/Programs/Python/Python313/python.exe"
            pip {
                install "httpx"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 大体量资产：images.zip 已是 STORED，禁止 aapt 再压缩；db 保留压缩
    androidResources {
        noCompress "zip"
    }

    sourceSets {
        main {
            // goshor_server 自身 + 通过 junction 提供的桌面端 app 包（import app.db）
            python.srcDirs += ["src/main/python", "d:/GOSHORE/.tools/mobile_py"]
            assets.srcDirs += ["d:/GOSHORE/.tools/mobile_prep/mobile_assets"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    dependencies {
        implementation 'androidx.core:core:1.13.1'
    }
}
