name: Release Desktop

# 手动触发：在 GitHub Actions 里点 Run workflow，或本地用 REST 触发。
# 产物：单文件 exe + 示例题库，作为 Release 附件上传（可重复运行，--clobber 覆盖）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（必须已存在）"
        required: true
        default: "v2026.10.21"

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt
          pip install pyinstaller python-docx pandas pdfplumber

      - name: 打包 exe
        env:
          PYTHONUTF8: "1"
        run: python tools/build_desktop_exe.py

      - name: 上传 Release 附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" "dist/GOSHORE上岸工作台.exe" "assets/content-sample.db" --clobber
