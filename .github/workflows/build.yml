name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 后端自动化测试：每次 push / PR 自动运行（E1）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: 运行测试
        run: python -m pytest tests -q

  # APK 构建：仅在手动触发时执行。
  # 说明：本项目 Android 构建依赖本地工具链（Chaquopy + .tools/ 下的 Gradle/SDK/wheels，
  # 以及 build.gradle 里指向本机的 buildPython 路径），这些均未纳入仓库，
  # 因此默认不在每次 push 时构建；如需在 CI 构建，请先补齐工具链与 gradlew。
  build-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        run: |
          cd android
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug; else
            echo "未找到 gradlew 包装器（本地工具链未纳入仓库），跳过构建"; exit 0; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
