<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8c2b21" data-light="#8c2b21" />
<title>上岸自习室 · 手机版</title>
<link rel="manifest" href="/m/manifest.json" />
<link rel="icon" href="/icons/favicon-64.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="/m/m.css?v=20261020" />
<script>
/* N5 夜间模式：先于 <body> 渲染应用，避免刷新时闪一下浅色。
   与 m.js 里的 Theme 块等价（那边负责后续切换、跟随系统、同步状态栏颜色）。 */
(function () {
  try {
    var v = localStorage.getItem("g:theme");
    v = v == null ? "auto" : JSON.parse(v);
    if (["auto", "light", "dark"].indexOf(v) < 0) v = "auto";
    var dark = v === "dark" ||
      (v === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) { document.documentElement.dataset.theme = "light"; }
})();
/* N4 字号：同样先于渲染应用，避免刷新时字号跳一下。 */
(function () {
  try {
    var z = localStorage.getItem("g:fontsize");
    z = z == null ? "md" : JSON.parse(z);
    var map = { s: "sm", m: "md", b: "lg" };   // 旧移动端 U-7 三档 → 四档
    z = map[z] || z;
    if (["sm", "md", "lg", "xl"].indexOf(z) < 0) z = "md";
    document.documentElement.dataset.fontsize = z;
    var lh = localStorage.getItem("g:lhloose");
    if (lh != null && JSON.parse(lh) === true) document.documentElement.dataset.lineheight = "loose";
  } catch (e) { document.documentElement.dataset.fontsize = "md"; }
})();
</script>
</head>
<body>
<header id="mhead">
  <span id="mTitle">上岸自习室</span>
</header>
<main id="view"></main>
<div id="guestBar" hidden>
  <span>当前为游客模式，学习数据只存在本机</span>
  <a href="#/login">注册 / 登录</a>
</div>
<nav id="tabbar">
  <a href="#/home" data-tab="home"><span class="ti">⌂</span><span>首页</span></a>
  <a href="#/practice" data-tab="practice"><span class="ti">✎</span><span>刷题</span></a>
  <a href="#/all" data-tab="all"><span class="ti">▦</span><span>功能</span></a>
  <a href="#/me" data-tab="me"><span class="ti">☰</span><span>我的</span></a>
</nav>
<div id="toast"></div>
<script src="/m/m.js?v=20261020"></script>
<script>
/* PWA（功能 3.1）：注册 Service Worker，支持 iOS「添加到主屏」后离线打开。 */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
  });
}
</script>
</body>
</html>
